name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '*/15 * * * *'   # Каждые 15 минут

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        env: [staging]
      fail-fast: false

    env:
      ENV: ${{ matrix.env }}
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium browser
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # - name: Run Prettier check
      #   run: npm run format:check

      - name: Run E2E tests (Chromium)
        run: npm run test:e2e
        continue-on-error: false

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/results.xml'
          check_name: 'Playwright Test Results (${{ matrix.env }})'
          fail_on_failure: false
          include_passed: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-xml-${{ matrix.env }}
          path: test-results/results.xml
          retention-days: 7

      - name: Upload test results (all)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.env }}
          path: test-results/
          retention-days: 7
