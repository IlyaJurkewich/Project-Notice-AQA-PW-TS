name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '*/15 * * * *'   # Каждые 15 минут

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    strategy:
      matrix:
        env: [staging]
      fail-fast: false

    env:
      ENV: ${{ matrix.env }}
      DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
      DEV_PASSWORD: ${{ secrets.DEV_PASSWORD }}
      STAGING_USERNAME: ${{ secrets.STAGING_USERNAME }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium browser
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # - name: Run Prettier check
      #   run: npm run format:check

      - name: Run E2E tests (Chromium)
        id: test-run
        run: npm run test:e2e
        continue-on-error: true

      - name: Parse test results and generate summary
        if: always()
        run: |
          echo "## 🎭 Playwright Test Results (${{ matrix.env }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "test-results/results.xml" ]; then
            # Парсим XML для получения статистики
            TESTS=$(grep -oP 'tests="\K[0-9]+' test-results/results.xml | head -1 || echo "0")
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results/results.xml | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results/results.xml | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' test-results/results.xml | head -1 || echo "0")
            TIME=$(grep -oP 'time="\K[0-9.]+' test-results/results.xml | head -1 || echo "0")
            
            PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
            
            echo "### 📊 Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| ⚠️ Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📝 Total | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 📋 Test Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Status | Test Name |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-----------|" >> $GITHUB_STEP_SUMMARY
            
            # Парсим тестовые кейсы
            grep -oP '<testcase[^>]*name="\K[^"]+' test-results/results.xml | while read -r testname; do
              # Проверяем, есть ли failure для этого теста
              if grep -q "name=\"$testname\"[^>]*>.*<failure" test-results/results.xml 2>/dev/null; then
                echo "| ❌ | $testname |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| ✅ | $testname |" >> $GITHUB_STEP_SUMMARY
              fi
            done
            
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Если есть ошибки, показываем детали
            if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
              echo "### ❌ Failed Tests Details" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -oP '<failure[^>]*message="\K[^"]+' test-results/results.xml | head -10 >> $GITHUB_STEP_SUMMARY || echo "No failure messages found"
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No test results found at test-results/results.xml" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'test-results/results.xml'
          check_name: 'Playwright Test Results (${{ matrix.env }})'
          fail_on_failure: false
          include_passed: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.env }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-xml-${{ matrix.env }}
          path: test-results/results.xml
          retention-days: 7

      - name: Upload test results (all)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.env }}
          path: test-results/
          retention-days: 7

      - name: Fail if tests failed
        if: steps.test-run.outcome == 'failure'
        run: exit 1
